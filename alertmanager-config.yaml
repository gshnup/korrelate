apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-monitoring-kube-prome-alertmanager
  namespace: monitoring
data:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'job']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'null'
      routes:
        - matchers:
            - alertname = "PaymentServiceHighErrorRate"
          receiver: korrelate
          group_wait: 5s
          repeat_interval: 5m
    receivers:
      - name: 'null'
      - name: korrelate
        webhook_configs:
          - url: 'http://172.20.0.1:8000/webhook'
            send_resolved: false
