kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: korrelate-dev
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 30000   # Grafana NodePort
        hostPort: 3000
        protocol: TCP
      - containerPort: 30001   # Prometheus NodePort
        hostPort: 9090
        protocol: TCP
      - containerPort: 30002   # Alertmanager NodePort
        hostPort: 9093
        protocol: TCP
      - containerPort: 30003   # PaymentService NodePort
        hostPort: 8088
        protocol: TCP
  - role: worker
  - role: worker
